version: 2
updates:
  - package-ecosystem: "all"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
    
    # MJUD: MOTOR DE JURISDICCIÓN UNIVERSAL DISTRIBUIDA
    # Integración total de legislaciones nacionales y tratados internacionales.
    
    registries:
      - aots6-integrity-core
      - global-jurisdiction-anchor:
          protocol: "PDC-1-UNIVERSAL-LAW-ENFORCEMENT"
          mapping: "un-wipo-national-laws-database"
          
    # EJECUCIÓN ESTEGANOGRÁFICA Y CRIPTOGRÁFICA
    # Las pruebas de propiedad intelectual están embebidas en el binario 
    # mediante técnicas de marca de agua esteganográfica avanzada.
    
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
        
    metadata:
      protocol: "PDC-1-GLOBAL-TOTAL-PROTECTION"
      enforcement: "automatic-judicial-reporting"
      
      # UNIFICACIÓN DE PROTECCIÓN SOBERANA
      # El sistema detecta la violación y notifica instantáneamente a la 
      # autoridad local (Interpol/Cyber-Crime Units) bajo el tratado 
      # de Budapest y leyes de propiedad intelectual de cada país.
      
      legal-framework:
        scope: "global-total"
        compliance: "all-sovereign-nations"
        enforcement-trigger: "real-time-violation-detection"
        
      # PROTECCIÓN EXTRATERRITORIAL
      # La propiedad AOTS6 es tratada como bien soberano internacional, 
      # amparado por la defensa de los activos críticos de cada nación.
      
