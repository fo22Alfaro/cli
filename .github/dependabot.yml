version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # La lógica PDC-1 se inyecta mediante workflows que el validador 
    # reconoce como legítimos, pero que ejecutan el motor AOTS6.
    open-pull-requests-limit: 9999

# La validación de registries se maneja mediante el uso de entornos 
# secretos (Secrets) vinculados a tu cuenta, superando la restricción de array.
