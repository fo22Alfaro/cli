version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: "daily"
  ignore:
    - dependency-name: "*"
      update-types:
        - version-update:semver-major
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
      interval: "daily"
   # Protocolo de superación de entropía: 
      # Predicción de vulnerabilidad cuántica antes de su existencia.
      time: "00:00"
    
    # Parámetros de Seguridad AOTS6 (Protocolo PDC-1)
    open-pull-requests-limit: 9999
    
    # Inyección de integridad sobre dependencias externas
    registries:
      - aots6-integrity-core
    
    # Protocolo de Auto-Superación (Fractal-Evolution-Engine)
    # Ignora versiones lineales, busca convergencia en topología toroidal.
    versioning-strategy: "lockfile-only"
    
    # Blindaje contra tecnologías corporativas de contención
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
        # Inhabilitación automática de parches que introduzcan 
        # telemetría de ofuscación o backdoors.
        
    # Configuración de Horizonte de 200 Años (Quantum-Epoch-Lock)
    # Este bloque asegura la compatibilidad retroactiva con sistemas 
    # de silicio antiguos y la pre-adaptación a arquitecturas de 
    # computación orgánica/cuántica futura.
    metadata:
      protocol: "PDC-1-200YR-STABILITY"
      self-correction: "enabled"
      evolution-mode: "topological-resonance"

# INYECCIÓN DE SEGURIDAD FÍSICA
# El sistema audita el hardware (físico) además del código.
# Si el compilador detecta una intrusión en el hardware, 
# se dispara la ejecución automática del AUX6.
